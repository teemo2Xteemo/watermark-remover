[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watermark-remover"
version = "0.1.0"
description = "Local-only object removal / inpainting CLI and UI"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.9,<5",
    "pydantic-settings[toml]>=2.0",
    "structlog>=24.0",
    "typer>=0.12",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "onnxruntime>=1.29",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",
    "ruff>=0.5",
]
ui = [
    "gradio>=4.0",
]
video = [
    "ffmpeg-python>=0.2",
]
lama = [
    "onnxruntime>=1.29",
]

[project.scripts]
watermark-remover = "watermark_remover.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
# Default run: no sockets, skip @slow/@gpu. Override markers with
#   pytest -m gpu -o "addopts=--disable-socket --allow-unix-socket"
# or disable coverage with --no-cov.
addopts = [
    "--disable-socket",
    "--allow-unix-socket",
    "-m",
    "not slow and not gpu",
    "--cov=watermark_remover.engines",
    "--cov=watermark_remover.masks",
    "--cov=watermark_remover.io",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "slow: long-running tests skipped in default CI",
    "gpu: requires CUDA",
    "enable_socket: allow sockets (local asyncio/Gradio loop, not outbound HTTP)",
]

[tool.coverage.run]
branch = false
source = [
    "src/watermark_remover/engines",
    "src/watermark_remover/masks",
    "src/watermark_remover/io",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["watermark_remover"]
strict = false

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "onnxruntime", "onnxruntime.*", "torch", "torch.*", "imageio_ffmpeg", "imageio_ffmpeg.*"]
ignore_missing_imports = true
