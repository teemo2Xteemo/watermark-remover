[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watermark-remover"
version = "0.1.0"
description = "Local-only object removal / inpainting CLI and UI"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.9,<5",
    "pydantic-settings[toml]>=2.0",
    "structlog>=24.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
ui = [
    "gradio>=4.0",
]
video = [
    "ffmpeg-python>=0.2",
]
lama = [
    "onnxruntime>=1.17",
]

[project.scripts]
watermark-remover = "watermark_remover.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: long-running tests skipped in default CI",
    "gpu: requires CUDA",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["watermark_remover"]
strict = false

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true
