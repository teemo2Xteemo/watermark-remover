name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (ffmpeg for video tests; no LaMa weights)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1

      - name: Install package (dev extras only; do not download models)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui,video,lama]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Fail on noqa abuse
        run: |
          if grep -RIn --include='*.py' -E '#[[:space:]]*noqa' src tests scripts; then
            echo "::error::# noqa comments are not allowed; fix the lint instead"
            exit 1
          fi

      - name: Mypy
        run: mypy src/watermark_remover

      - name: Pytest (no slow, no gpu, sockets blocked)
        run: pytest -m "not slow and not gpu"
